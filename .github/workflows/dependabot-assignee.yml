name: Dependabot assignee

# pull_request_target so the job runs with the repository's own GITHUB_TOKEN:
# the Dependabot-sourced token a plain pull_request run gets is blocked by the
# org IP allow list.
on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  issues: write
  pull-requests: write

jobs:
  assign:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Assign the rotation
        run: |
          people=(jennifer-takagi jacklaurencegaray)
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/assignees" \
            -f "assignees[]=${people[$((10#$(date +%j) % ${#people[@]}))]}"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
