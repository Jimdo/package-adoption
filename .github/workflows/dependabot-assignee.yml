name: Dependabot assignee

# pull_request_target so the job runs with the repository's own GITHUB_TOKEN.
# On a plain pull_request from Dependabot the token comes from the Dependabot
# secret source, which the Jimdo org IP allow list rejects with a 403.
on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  issues: write
  pull-requests: write

jobs:
  assign:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Assign the rotation
        run: |
          people=(jennifer-takagi jacklaurencegaray)
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/assignees" \
            -f "assignees[]=${people[$((10#$(date +%j) % ${#people[@]}))]}"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
