version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
      time: '05:30'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 99
    versioning-strategy: 'increase'
    commit-message:
      prefix: 'fix'
      prefix-development: 'chore'
      include: 'scope'
    cooldown:
      default-days: 3
    ignore:
      # TypeScript 7 is the native (Go) rewrite; its compiler API is
      # incompatible with ts-node@10, which the release script relies on.
      # Hold at 6.x until the tooling moves off ts-node.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
      octokit:
        patterns:
          - 'octokit'
          - '@octokit/*'
      commitizen:
        patterns:
          - '@ryansonshine/*'
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "13:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 3
